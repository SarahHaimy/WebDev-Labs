<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reservations</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
        background: linear-gradient(135deg, #e3eefc 0%, #cfe0f7 100%);
        color: #2b2b2b;
      }

      .card {
        width: 100%;
        max-width: 420px;
        padding: 48px 40px;
        background: #fff;
        border-radius: 22px;
        box-shadow: 0 8px 24px rgba(60, 100, 160, 0.18);
        text-align: center;
      }

      h1 {
        margin: 0 0 22px;
        font-size: 2.2rem;
        font-weight: 700;
        line-height: 1.25;
        color: #2b2b2b;
      }

      .row {
        display: flex;
        gap: 10px;
        justify-content: center;
      }

      input {
        flex: 1;
        min-width: 0;
        padding: 10px 12px;
        font-size: 1rem;
        border: 1px solid #cfcfcf;
        border-radius: 8px;
        outline: none;
        transition: border-color 0.15s, box-shadow 0.15s;
      }

      input:focus {
        border-color: #5b95ea;
        box-shadow: 0 0 0 3px rgba(91, 149, 234, 0.25);
      }

      button {
        padding: 10px 18px;
        font-size: 1rem;
        font-weight: 500;
        color: #fff;
        background: #5b95ea;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.15s;
      }

      button:hover {
        background: #4783dc;
      }

      button:focus-visible {
        outline: 3px solid rgba(91, 149, 234, 0.45);
        outline-offset: 2px;
      }

      ul {
        list-style: none;
        margin: 18px 0 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      ul:empty {
        display: none;
      }

      li {
        padding: 10px 12px;
        background: #e8f1fd;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.15s;
      }

      li:hover {
        background: #d8e7fa;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 id="title">Welcome</h1>

      <div class="row">
        <input id="name" placeholder="Your name" />
        <button id="greet">Greet</button>
      </div>

      <ul id="list"></ul>
    </div>

    <script>
      function addName() {
        const input = document.getElementById('name');
        const name = input.value.trim();

        if (!name) return;

        document.getElementById('title').textContent = `Hello, ${name}!`;

        const li = document.createElement('li');
        li.textContent = name;
        document.getElementById('list').appendChild(li);

        input.value = ''; 
      }

      function removeName(e) {
        if (e.target.nodeName === 'LI') {
          const name = e.target.textContent;
          document.getElementById('title').textContent = `Goodbye, ${name}!`;
          e.target.remove(); 
        }
      }

      document.getElementById('greet').addEventListener('click', addName);
      document.getElementById('list').addEventListener('click', removeName);
    </script>
  </body>
</html>
